# .github/workflows/deploy.yml
name: Build & Deploy via Kamal 2

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Asegurar que el nombre de la imagen esté 100% en minúsculas para GHCR
      - name: Normalizar repositorio a minúsculas
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Autenticación robusta en GHCR usando Personal Access Token (Clásico) con fallback a GITHUB_TOKEN
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Compilar y publicar imagen en los runners de GitHub Actions (builder.remote: false)
      - name: Compilar y Publicar Imagen en GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Configurar acceso SSH al VPS mediante SSH Agent
      - name: Configurar acceso SSH al VPS
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Evitar errores Net::SSH::HostKeyMismatch escaneando claves rsa, ecdsa y ed25519
      - name: Configurar Known Hosts de SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 ${{ secrets.VPS_IP || '149.50.147.202' }} >> ~/.ssh/known_hosts
          echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config
          chmod 600 ~/.ssh/known_hosts ~/.ssh/config

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Instalar Kamal
        run: gem install kamal

      # Inyección de Secretos con Auto-URL-Encoding para contraseñas de Postgres con caracteres especiales (#, &, @, etc.)
      - name: Preparar Secretos de Kamal
        env:
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          mkdir -p .kamal
          ENCODED_PG_PASS=$(node -e 'console.log(encodeURIComponent(process.env.PG_PASS || ""))')
          cat <<EOF > .kamal/secrets
          KAMAL_REGISTRY_PASSWORD=${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          DATABASE_URL="postgresql://${{ secrets.POSTGRES_USER || 'planner' }}:${ENCODED_PG_PASS}@infra-core-postgres:5432/${{ secrets.POSTGRES_DB || 'oboeru_prod' }}"
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          EOF
          chmod 600 .kamal/secrets

      # Despliegue con Kamal usando la versión exacta ya compilada
      - name: Desplegar con Kamal
        run: kamal deploy --version="${{ github.sha }}"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REGISTRY_USERNAME: ${{ github.repository_owner }}
          VPS_IP: ${{ secrets.VPS_IP || '149.50.147.202' }}
          APP_SUBDOMAIN: ${{ vars.APP_SUBDOMAIN || 'oboeru-api' }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME || 'planner.ar' }}

      # Ejecutar migraciones SQL y sincronización ETL automáticamente post-deploy
      - name: Ejecutar Migraciones SQL y Worker ETL en Producción
        run: |
          ssh root@${{ secrets.VPS_IP || '149.50.147.202' }} '
            CONTAINER_ID=$(docker ps -qf "name=oboeru-backend-web" | head -n 1)
            echo "Ejecutando migraciones y ETL en contenedor: $CONTAINER_ID"
            docker exec "$CONTAINER_ID" node dist/db/migrate.js
            docker exec "$CONTAINER_ID" node dist/etl/worker.js
          '
